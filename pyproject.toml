[project]
name = "trustworthy-ai"
version = "0.1.0"
description = "Input and Output Guardrails for AI Applications - Privacy, Safety, and Reliability"
readme = "README.md"
authors = [
    { name = "kimdotpy", email = "kimdotpy@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
